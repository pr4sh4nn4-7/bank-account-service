# https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  labels:
    app: redis-deploy
spec:
  selector:
    matchLabels:
      app: redis-deploy
  replicas: 1
  template:
    metadata:
      labels:
        app: redis-deploy
    spec:
      # initContainers:
      # Init containers are exactly like regular containers, except:
      # - Init containers always run to completion.
      # - Each init container must complete successfully before the next one starts.
      containers:
        - name: redis-deploy
          image: redis:trixie
          env:
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: myenv
                  key: REDIS_PORT
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /var/lib/redis

      volumes:
        - name: redis-data
          hostPath:
            path: /opt/redis-data
            type: DirectoryOrCreate
