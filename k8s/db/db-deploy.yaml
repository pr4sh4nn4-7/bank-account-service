apiVersion: apps/v1
kind: Deployment
metadata:
  name: databse-deployment
  labels:
    app: databse-deployment
spec:
  selector:
    matchLabels:
      app: databse-deployment
  replicas: 1
  template:
    metadata:
      labels:
        app: databse-deployment
    spec:
      # initContainers:
      # Init containers are exactly like regular containers, except:
      # - Init containers always run to completion.
      # - Each init container must complete successfully before the next one starts.
      containers:
        - name: databse-deployment
          image: mysql:5.7
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: myenv
                  key: MYSQL_PASSWORD
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

            - name: mysql-backups
              mountPath: /backups
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc

        - name: mysql-backups
          hostPath: # it doesn't have persistent volume if
            path: /opt/mysql-backups
            type: DirectoryOrCreate
